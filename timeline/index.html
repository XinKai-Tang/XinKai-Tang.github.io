d="body-wrap"><header class="not-home-page" id="page-header" style="background-image: url(/img/timeline_img.webp);"><nav id="nav"><span id="blog-info"><a class="nav-site-title" href="/"><span class="site-name">倾珞珈蓝</span></a></span><div id="menus"><div id="search-button"><span class="site-page social-icon search"><i class="fas fa-search fa-fw"></i><span> 搜索</span></span></div><div class="menus_items"><div class="menus_item"><a class="site-page" href="/"><i class="fa-fw fas fa-home"></i><span> 首页</span></a></div><div class="menus_item"><span class="site-page group"><i class="fa-fw fas fa-book"></i><span> 文章</span><i class="fas fa-chevron-down"></i></span><ul class="menus_item_child"><li><a class="site-page child" href="/categories/"><i class="fa-fw fas fa-folder-open"></i><span> 分类</span></a></li><li><a class="site-page child" href="/tags/"><i class="fa-fw fas fa-tags"></i><span> 标签</span></a></li><li><a class="site-page child" href="/archives/"><i class="fa-fw fas fa-archive"></i><span> 归档</span></a></li></ul></div><div class="menus_item"><a class="site-page" href="/timeline/"><i class="fa-fw fas fa-images"></i><span> 说说</span></a></div><div class="menus_item"><a class="site-page" href="/messageboard/"><i class="fa-fw fa fa-paper-plane"></i><span> 留言版</span></a></div><div class="menus_item"><span class="site-page group"><i class="fa-fw fas fa-list"></i><span> 更多</span><i class="fas fa-chevron-down"></i></span><ul class="menus_item_child"><li><a class="site-page child" href="/link/"><i class="fa-fw fas fa-link"></i><span> 友链</span></a></li><li><a class="site-page child" href="/myself/"><i class="fa-fw fas fa-id-card"></i><span> 关于</span></a></li></ul></div></div><div id="toggle-menu"><span class="site-page"><i class="fas fa-bars fa-fw"></i></span></div></div></nav><div id="page-site-info"><h1 id="site-title">说说</h1></div></header><main class="layout hide-aside" id="content-inner"><div class="nc" id="page"><div id="article-container"><script type="application/json" id="shuoshuo-data">[{"author":"IEEE Transactions on Medical Imaging","avatar":"https://origin.picgo.net/2026/11/27/IEEETMI1f676c0c89583a37.th.png","date":"2026-01-20 12:05:20","key":"Valine,Twikoo","content":"\u003cp\u003e\u003cstrong\u003eConvUNET: a Novel Depthwise Separable ConvNet for Lung Nodule Segmentation\u003c/strong\u003e\u003cbr\u003e\n\u003cimg src=\"https://origin.picgo.net/2026/11/27/NGP-Net1e304671ab737bf9.md.jpg\" alt=\"NGP-Net\"\u003e\u003cbr\u003e\nAccurate monitoring of pulmonary nodules’ growth is crucial for preventing lung cancer progression and improving patient outcomes. Yet, identifying high-risk nodules in computed tomography (CT) scans remains challenging due to subtle growth patterns, irregular follow-up intervals, and the limitations of current diagnostic tools. Existing methods often depend on single-timepoint analyses or assume fixed temporal intervals, constraining prediction to rigid scenarios. To address these limitations, we propose NGP-Net, a W-shaped architecture for dynamic nodule growth prediction from irregular longitudinal CT scans. NGP-Net introduces a Spatial-Temporal Encoding Module (STEM) that learns temporal dynamics directly from irregularly sampled data, and a dual-branch decoder that reconstructs high-fidelity nodule textures and shapes at arbitrary future timepoints. We further release a curated dataset of 378 chest CT scans from 103 patients with 226 pulmonary nodules, each followed across at least three timepoints spanning 2–64 months and annotated by seven radiologists. Extensive evaluation demonstrates that NGP-Net achieves state-of-the-art performance on this new dataset, obtaining the lowest mean square error of 6.13×10−3 (overall) and 1.28×10−4 (nodule-specific), with substantial improvements in Dice similarity coefficient ( 10.55% ), peak signal-to-noise ratio ( 0.29 dB), and structural similarity index ( 5.94% ). NGP-Net’s robust and precise predictions across varied growth scenarios highlight its potential to support radiologists in clinical decision-making. The source code and dataset are publicly available at \u003ca href=\"https://ieeexplore.ieee.org/document/11359361\"\u003eGitHub\u003c/a\u003e and \u003ca href=\"https://www.kaggle.com/datasets/eb40d82b3bdd92bcdd202c50092443a8280a039f70fd96f2ad0cbc988ae57ca7\"\u003eKaggle\u003c/a\u003e.\u003c/p\u003e\n","tags":["IEEE TMI","Growth Prediction"]},{"author":"International Conference on Bioinformatics and Biomedicine","avatar":"https://origin.picgo.net/2026/11/27/BIBM2024fa15770358046587.th.jpg","date":"2024-12-03 21:13:14","key":"Valine,Twikoo","content":"\u003cp\u003e\u003cstrong\u003ePN-Quant: An Automated Pulmonary Nodule Quantification Method for Full-Size CT Scans\u003c/strong\u003e\u003cbr\u003e\n\u003cimg src=\"https://origin.picgo.net/2026/11/27/PN-Quant73c726b072922c85.md.jpg\" alt=\"PN-Quant\"\u003e\u003cbr\u003e\nPulmonary nodule quantification is essential in forecasting and diagnosing potential malignant nodules, providing critical information for early intervention and treatment planning. However, most existing assistant diagnosis techniques primarily focus on the localization of lung nodules without comprehensive quantitative analysis, limiting their utility in clinical practice. To address this significant limitation, we present a novel and robust pulmonary nodule quantification framework named PN-Quant. It integrates a detection module, a segmentation module, and a quantification module to enable automated identification and precise measurement of lung nodules in full-size Computer Tomography (CT) scans, which facilitates the extraction of geometric characteristics, including volume, surface area, mass, sphericity, compactness, and elongation, offering valuable quantitative data for accurate nodule assessment. This study evaluates multiple PN-Quant pipelines with diverse configurations using datasets LIDC-IDRI, LNDb-19, and MSD-lung. Notably, the pipeline combining SANet and 3D UX-Net demonstrated superior performance, yielding low relative errors of 16.8%, 39.5%, and 24.4% on the respective datasets. These results underscore the effectiveness of the automated pipeline based on PN-Quant in efficiently and accurately quantifying pulmonary nodules across diverse datasets. The findings from this research highlight the potential of PN-Quant as a valuable tool for enhancing the precision and reliability of pulmonary nodule analysis in clinical settings, ultimately contributing to improved patient outcomes and clinical decision-making. Our source code is available at \u003ca href=\"https://github.com/Xinkai-Tang/PN-Quant\"\u003eGitHub\u003c/a\u003e.\u003c/p\u003e\n","tags":["IEEE BIBM 2024","Quantification"]},{"author":"International Conference on Bioinformatics and Biomedicine","avatar":"https://origin.picgo.net/2026/11/27/BIBM20237cca9a3a619699be.th.png","date":"2023-12-05 09:05:21","key":"Valine,Twikoo","content":"\u003cp\u003e\u003cstrong\u003eConvUNET: a Novel Depthwise Separable ConvNet for Lung Nodule Segmentation\u003c/strong\u003e\u003cbr\u003e\n\u003cimg src=\"https://origin.picgo.net/2026/11/27/ConvUNETe2183b94d7cb9b85.md.jpg\" alt=\"ConvUNET\"\u003e\u003cbr\u003e\nLung nodule segmentation is usually considered a 3D semantic segmentation task. Due to the small size, diverse morphology, and low recognition of lung nodules, it is hard to segment any nodule precisely. To solve this problem, we propose a lightweight depthwise separable convolutional network named ConvUNET, which consists of a hierarchical encoder and a U-shaped decoder. Compared with some Transformer-based models (e.g., SwinUNETR) and ConvNeXt-based models (e.g., 3D UX-Net), our model has the advantages of fewer parameters, faster inference speed, and higher accuracy. We test the segmentation performance on the LUNA-16 and LNDb-19 datasets using standard 5-fold cross-validations, and the proposed method achieves competitive dice scores of 88.90% and 84.16%, respectively. Besides, it also shows considerable precision in segmenting lung nodules with diverse characteristics. Our source code is available at \u003ca href=\"https://github.com/Xinkai-Tang/ConvUNET\"\u003eGitHub\u003c/a\u003e.\u003c/p\u003e\n","tags":["IEEE BIBM 2023","Segmentation"]}]</script><script>(() => {
  const limitConfig = {}

  const escapeHtml = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')

  const sortDataByDate = data => data.sort((a, b) => new Date(b.date) - new Date(a.date))

  const filterDataByLimit = (data, limit) => {
    if (!limit || !limit.type) return data
    if (limit.type === 'num') return data.slice(0, limit.value)
    if (limit.type === 'date') {
      const limitDate = new Date(limit.value)
      return data.filter(item => new Date(item.date) >= limitDate)
    }
    return data
  }

  const dateFormatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: "Asia/Shanghai" || Intl.DateTimeFormat().resolvedOptions().timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  })

  const formatToTimeZone = (date) => {
    const fullDate = date.length === 10 ? `${date} 00:00:00` : date
    const [day, month, year, hour, minute, second] = dateFormatter.format(new Date(fullDate)).match(/\d+/g)
    return `${year}-${month}-${day} ${hour}:${minute}:${second}`
  }

  const addLazyload = str => {
    const lazyConfig = {
      enable: false,
      native: false,
      field: "site",
      placeholder: "/null",
    }

    if (!lazyConfig.enable || lazyConfig.field !== 'site' || str.indexOf('<img') === -1) return str
    const parser = new DOMParser()
    const doc = parser.parseFromString(str, 'text/html')
    const images = doc.querySelectorAll('img')

    images.forEach(img => {
      if (lazyConfig.native) {
        img.setAttribute('loading', 'lazy')
      } else {
        const src = img.getAttribute('src')
        img.setAttribute('data-lazy-src', src)

        if (lazyConfig.placeholder) {
          img.setAttribute('src', lazyConfig.placeholder)
        } else {
          img.removeAttribute('src')
        }
      }
    })
    return doc.body.innerHTML
  }

  let currentPage = 1
  const itemsPerPage = 8
  let totalPages = 0
  let data = []

  const renderData = (dataSlice) => {
    const content = dataSlice.map(item => {
      const formattedDate = formatToTimeZone(item.date)
      const tags = item.tags && item.tags.map(tag => `<span class="shuoshuo-tag">${escapeHtml(tag)}</span>`).join('') || ''
      const commentButton = item.key && false
        ? `<div class="shuoshuo-comment-btn" onclick="addCommentToShuoshuo(event)">
            <i class="fa-solid fa-comments"></i>
          </div>`
        : ''
      const commentContainer = item.key
        ? `<div class="shuoshuo-comment no-comment" data-key="${escapeHtml(item.key)}"></div>`
        : ''

      return `
        <div class="shuoshuo-item">
          <div class="container">
            <div class="shuoshuo-item-header">
              <div class="shuoshuo-avatar">
                <img class="no-lightbox" src="${item.avatar ? escapeHtml(item.avatar) : "/img/avatar.jpg"}">
              </div>
              <div class="shuoshuo-info">
                <div class="shuoshuo-author">${item.author ? escapeHtml(item.author) : "Kevin Tang"}</div>
                <time class="shuoshuo-date" title="${formattedDate}">
                  ${btf.diffDate(formattedDate, true)}
                </time>
              </div>
            </div>
            <div class="shuoshuo-content">${addLazyload(item.content)}</div>
            <div class="shuoshuo-footer ${tags ? 'flex-between' : 'flex-end'}">
              ${tags ? `<div class="shuoshuo-tags">${tags}</div>` : ''}
              ${commentButton}
            </div>
          </div>
          ${commentContainer}
        </div>`
    }).join('')

    const container = document.getElementById('article-container')
    container.innerHTML = content

    window.lazyLoadInstance && window.lazyLoadInstance.update()
    document.dispatchEvent(new Event('shuoshuo:rendered'))
  }

  const setupNavEvents = (nav) => {
    nav.querySelector('.shuoshuo-prev-btn').addEventListener('click', () => {
      if (currentPage > 1) { currentPage--; renderPage(currentPage) }
    })
    nav.querySelector('.shuoshuo-next-btn').addEventListener('click', () => {
      if (currentPage < totalPages) { currentPage++; renderPage(currentPage) }
    })

    const input = nav.querySelector('.shuoshuo-page-input')

    input.addEventListener('focus', e => { e.target.placeholder = '' })
    input.addEventListener('blur', e => {
      if (!e.target.value.trim()) e.target.placeholder = currentPage
    })

    input.addEventListener('input', e => {
      const value = parseInt(e.target.value) || 0
      let wasInvalid = false

      if (value > totalPages) { e.target.value = totalPages; wasInvalid = true }
      else if (value < 1 && e.target.value !== '') { e.target.value = 1; wasInvalid = true }

      if (wasInvalid) {
        e.target.classList.add('invalid')
        setTimeout(() => e.target.classList.remove('invalid'), 500)
      }
    })

    input.addEventListener('keydown', e => {
      const value = e.target.value + e.key

      if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete' ||
          e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
          e.key === 'Tab' || e.ctrlKey || e.metaKey) {
        if (e.key === 'Enter') {
          const inputValue = e.target.value.trim()
          const inputPage = inputValue === '' ? currentPage : parseInt(inputValue)
          if (inputPage >= 1 && inputPage <= totalPages && inputPage !== currentPage) {
            currentPage = inputPage
            renderPage(currentPage)
          } else if (inputValue === '') {
            renderPage(currentPage)
          }
        }
        return
      }

      if (!/^\d$/.test(e.key)) {
        e.preventDefault()
        return
      }

      const newValue = parseInt(value) || 0
      if (newValue > totalPages || (value.length > 1 && newValue === 0)) {
        e.preventDefault()
        e.target.classList.add('invalid')
        setTimeout(() => e.target.classList.remove('invalid'), 500)
      }
    })
  }

  const renderNavigation = () => {
    const container = document.getElementById('article-container')
    let nav = container.nextElementSibling
    const pageInfoTemplate = '第 ${current} 页 / 共 ${total} 页'
    const pageInfoText = pageInfoTemplate
      .replace(/\$\{current}/g, currentPage)
      .replace(/\$\{total}/g, totalPages)

    if (!nav || !nav.classList.contains('shuoshuo-navigation')) {
      nav = document.createElement('div')
      nav.className = 'shuoshuo-navigation'
      nav.innerHTML = `
        <button class="shuoshuo-prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <span class="shuoshuo-page-info"></span>
        <input type="number" class="shuoshuo-page-input" min="1">
        <button class="shuoshuo-next-btn"><i class="fa-solid fa-chevron-right"></i></button>
      `
      container.insertAdjacentElement('afterend', nav)
      setupNavEvents(nav)
    }

    nav.querySelector('.shuoshuo-page-info').textContent = pageInfoText
    nav.querySelector('.shuoshuo-prev-btn').disabled = currentPage === 1
    nav.querySelector('.shuoshuo-next-btn').disabled = currentPage === totalPages
    const input = nav.querySelector('.shuoshuo-page-input')
    input.max = totalPages
    input.placeholder = currentPage
  }

  const renderPage = (page) => {
    const start = (page - 1) * itemsPerPage
    const end = start + itemsPerPage
    const pageData = data.slice(start, end)
    renderData(pageData)
    renderNavigation()
  }

  const loadShuoshuo = async () => {
    const container = document.getElementById('article-container')
